name: Supabase Keep-Alive (Topikal Kertas 2 2026)

on:
  schedule:
    # Runs at 04:00 UTC (12:00 PM Malaysia time) every Monday, Wednesday, and Friday
    - cron: '0 4 * * 1,3,5'
  workflow_dispatch: # Allows manual trigger anytime via GitHub Actions UI

jobs:
  keep-alive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat Query to Supabase
        run: |
          PROJECT_REF="fhwtxkbnxpdgrqmajujr"
          BASE_URL="https://${PROJECT_REF}.supabase.co"
          ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

          if [ -z "$ANON_KEY" ]; then
            echo "❌ ERROR: SUPABASE_ANON_KEY secret is not configured in GitHub Secrets!"
            echo "Please go to: Repository Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Name: SUPABASE_ANON_KEY"
            echo "Value: <Your Supabase Project 'anon' key>"
            exit 1
          fi

          echo "=========================================="
          echo "📡 Pinging Supabase Project: $PROJECT_REF"
          echo "⏰ Timestamp: $(date -u)"
          echo "=========================================="

          # Ping 1: OpenAPI Schema definition request (triggers PostgreSQL metadata catalog query)
          echo "1️⃣ Querying PostgREST Schema endpoint..."
          SCHEMA_CODE=$(curl -s -o /tmp/schema_res.json -w "%{http_code}" \
            -X GET "${BASE_URL}/rest/v1/" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}")

          echo "   HTTP Status: $SCHEMA_CODE"

          # Ping 2: Target table query if provided
          TABLE="${{ secrets.SUPABASE_PING_TABLE }}"
          if [ -n "$TABLE" ]; then
            echo "2️⃣ Querying table '${TABLE}'..."
            TABLE_CODE=$(curl -s -o /tmp/table_res.json -w "%{http_code}" \
              -X GET "${BASE_URL}/rest/v1/${TABLE}?select=*&limit=1" \
              -H "apikey: ${ANON_KEY}" \
              -H "Authorization: Bearer ${ANON_KEY}")
            echo "   HTTP Status: $TABLE_CODE"
          fi

          # Optional: Auto-Restore if Management Token is provided and project is paused
          MGMT_TOKEN="${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}"
          if [ -n "$MGMT_TOKEN" ] && [ "$SCHEMA_CODE" -eq 503 ]; then
            echo "⚠️ Project appears paused (HTTP 503). Attempting auto-restore via Management API..."
            RESTORE_CODE=$(curl -s -o /tmp/restore_res.json -w "%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/restore" \
              -H "Authorization: Bearer ${MGMT_TOKEN}")
            echo "   Restore Trigger Status: $RESTORE_CODE"
          fi

          if [ "$SCHEMA_CODE" -eq 200 ] || [ "$SCHEMA_CODE" -eq 206 ]; then
            echo "✅ SUCCESS: Supabase PostgreSQL instance received activity. Inactivity counter reset!"
          elif [ "$SCHEMA_CODE" -eq 401 ]; then
            echo "⚠️ HTTP 401: Unauthorized. Please check if SUPABASE_ANON_KEY secret is correct."
            exit 1
          else
            echo "ℹ️ Response Code: $SCHEMA_CODE (Database request processed)"
          fi
