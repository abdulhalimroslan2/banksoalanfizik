<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="38" height="38">
  <!-- Atom center nucleus -->
  <circle cx="50" cy="50" r="7.5" fill="#DC2626"/>
  
  <!-- Orbit 1: Horizontal -->
  <ellipse cx="50" cy="50" rx="42" ry="15" stroke="#DC2626" stroke-width="4.5" fill="none"/>
  
  <!-- Orbit 2: Tilted 60 deg -->
  <ellipse cx="50" cy="50" rx="42" ry="15" stroke="#DC2626" stroke-width="4.5" fill="none" transform="rotate(60 50 50)"/>
  
  <!-- Orbit 3: Tilted -60 deg -->
  <ellipse cx="50" cy="50" rx="42" ry="15" stroke="#DC2626" stroke-width="4.5" fill="none" transform="rotate(-60 50 50)"/>
</svg>
